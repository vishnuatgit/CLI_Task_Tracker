[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-task-tracker"
dynamic = ["version"]
description = "A small command-line task tracker with JSON storage."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chandana Vishnu Jayanth" }]
keywords = ["cli", "tasks", "todo", "json"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/vishnuatgit/CLI_Task_Tracker"
Issues = "https://github.com/vishnuatgit/CLI_Task_Tracker/issues"

[project.scripts]
tasks = "task_tracker.cli:main"

[tool.setuptools.dynamic]
version = { attr = "task_tracker.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=task_tracker --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "PT"]
